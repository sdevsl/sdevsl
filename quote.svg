<svg xmlns="http://w3.org" viewBox="0 0 650 60" width="100%" height="60">
  <defs>
    <!-- The filter that creates the actual glow effect -->
    <filter id="yellow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .glow-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-style: italic;
      font-weight: 500;
      fill: #FFD700;
      filter: url(#yellow-glow);
    }
  </style>

  <!-- Centers the text perfectly within the image bounds -->
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" class="glow-text">
    "If you want to shine like a sun, first burn like a sun"
  </text>
</svg>
